name: probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: exec
        env:
          ZT_IDENTITY: ${{ secrets.ZT_IDENTITY }}
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
        run: |
          set +e
          mkdir -p out
          echo '' | base64 -d > /tmp/probe.sh
          bash /tmp/probe.sh > out/result.txt 2>&1
          echo "EXIT=$?" >> out/result.txt
      - name: commit back
        run: |
          git config user.email probe@local
          git config user.name probe
          git add -A out
          git commit -m "result" || echo "no change"
          git push || echo "push skipped"
